name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Install shellcheck
        run: |
          SHELLCHECK_VERSION=0.10.0
          mkdir -p .bin
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          install -m 755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" .bin/
          rm -rf "shellcheck-v${SHELLCHECK_VERSION}"

      - name: Install shfmt
        run: |
          SHFMT_VERSION=3.10.0
          mkdir -p .bin
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o .bin/shfmt
          chmod +x .bin/shfmt

      - name: Run lint
        run: npm run lint
