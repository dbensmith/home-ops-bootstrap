---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      packages: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load shared Super-Linter configuration
        shell: bash
        run: |
          grep -vE '^\s*(#|$)' .github/super-linter.env >> "$GITHUB_ENV"

      - name: Restore Super-Linter caches
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/_github_home/.cache
          key: ${{ runner.os }}-super-linter-cache-${{ hashFiles('.github/super-linter.env', '.github/workflows/lint.yml') }}
          restore-keys: |
            ${{ runner.os }}-super-linter-cache-

      - name: Super-linter
        uses: super-linter/super-linter@v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          SAVE_SUPER_LINTER_SUMMARY: true
          FAIL_ON_INVALID_GITHUB_ACTIONS_EVENT_CONFIGURATION: true
          MULTI_STATUS: true
